services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbano-express-orders
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      ORDER_API_TOKEN: urbano-demo-token
